<style>
/* Layout: one narrow dictionary column. Headwords in Caslon, everything else in Source Serif, black ink on paper, thin rules between sections like the daily email. */
:root {
  --paper: #ffffff;
  --ink: #141414;
  --muted: #67645f;
  --rule: #dcdad6;
  --soft: #f5f5f3;
  --right: #1f6b3a;
  --right-bg: #eef5ef;
  --wrong: #a3301f;
  --wrong-bg: #f9edeb;
  --display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #121212;
    --ink: #ecebe8;
    --muted: #9c9993;
    --rule: #34332f;
    --soft: #1b1b1a;
    --right: #82c79a;
    --right-bg: #15241a;
    --wrong: #f0907f;
    --wrong-bg: #2b1714;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121212;
  --ink: #ecebe8;
  --muted: #9c9993;
  --rule: #34332f;
  --soft: #1b1b1a;
  --right: #82c79a;
  --right-bg: #15241a;
  --wrong: #f0907f;
  --wrong-bg: #2b1714;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  margin: 0;
}
.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 24px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 30px;
}
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .01em; }
.status { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.section { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; }
.eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(28px, 6vw, 36px);
  line-height: 1.18;
  text-wrap: balance;
  margin: 0;
}
h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ink);
}
p { margin: 0; }
.lede { color: var(--muted); max-width: 34em; }
.note { font-size: 14px; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit;
  font-size: 17px;
  padding: 12px 20px;
  border: 1px solid var(--ink);
  cursor: pointer;
  border-radius: 0;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { opacity: .88; }
.btn.primary:disabled { opacity: .4; cursor: default; }
.btn.secondary { background: transparent; color: var(--ink); }
.btn.secondary:hover { background: var(--soft); }
.btn.quiet {
  background: transparent;
  color: var(--muted);
  border-color: transparent;
  padding-inline: 4px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stat { padding: 14px 4px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--rule); padding-left: 14px; }
.stat .n { font-family: var(--display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--muted); }
@media (max-width: 460px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(3) { border-left: 0; padding-left: 4px; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
}

.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 13px; height: 5px; background: var(--rule); }
.meter i.on { background: var(--ink); }

.bank { list-style: none; margin: 0; padding: 0; }
.bank li { border-bottom: 1px solid var(--rule); }
.entry {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 16px;
  text-align: left;
  background: transparent;
  color: inherit;
  border: 0;
  font: inherit;
  padding: 13px 0;
  cursor: pointer;
}
.entry .head { font-family: var(--display); font-size: 21px; }
.entry .pos { font-family: var(--body); font-style: italic; color: var(--muted); font-size: 15px; margin-left: 6px; }
.entry .lvl { text-align: right; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 6px; }
.entry .def { grid-column: 1 / -1; color: var(--muted); font-size: 16px; }
.entry .missed { color: var(--wrong); }
.detail { padding: 0 0 16px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.detail .ctx { display: flex; flex-direction: column; gap: 1px; }
.detail .tally { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.qhead { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 2px; background: var(--rule); margin: 10px 0 28px; }
.bar i { display: block; height: 100%; background: var(--ink); transition: width .3s ease; }
.prompt {
  font-family: var(--display);
  font-size: clamp(22px, 5vw, 27px);
  line-height: 1.4;
  text-wrap: pretty;
}
.prompt.headword { font-size: clamp(34px, 8vw, 44px); line-height: 1.1; }
.sub { color: var(--muted); font-size: 16px; margin-top: 8px; }
.blank {
  display: inline-block;
  min-width: 4.6em;
  border-bottom: 2px solid var(--ink);
  line-height: 1.1;
  text-align: center;
}
.blank.filled { min-width: 0; border-bottom-width: 1px; padding-inline: 2px; font-weight: 700; }
.weak { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

.options { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.option {
  display: flex;
  gap: 14px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--ink); }
.option:disabled { cursor: default; }
.option .k { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 1ch; }
.option.word { font-family: var(--display); font-size: 19px; }
.option.right { border-color: var(--right); background: var(--right-bg); }
.option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.option.dim { opacity: .55; }

.typed { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.typed .line { display: flex; gap: 8px; }
.typed input, .typed textarea {
  flex: 1;
  min-width: 0;
  font-family: var(--display);
  font-size: 20px;
  padding: 11px 14px;
  border: 1px solid var(--ink);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
  width: 100%;
}
.typed textarea { font-family: var(--body); font-size: 18px; line-height: 1.45; resize: vertical; }
.typed .right { border-color: var(--right); background: var(--right-bg); }
.typed .wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.hint { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

.slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
.slot {
  width: 30px;
  height: 40px;
  border-bottom: 2px solid var(--ink);
  font-family: var(--display);
  font-size: 24px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 2px;
}
.slots.right .slot { border-color: var(--right); color: var(--right); }
.slots.wrong .slot { border-color: var(--wrong); color: var(--wrong); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.tile {
  width: 44px;
  height: 46px;
  font-family: var(--display);
  font-size: 22px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
.tile:disabled { opacity: .2; cursor: default; }

.match { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 10px; margin-top: 24px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.pair {
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  line-height: 1.35;
  cursor: pointer;
  min-height: 52px;
}
.pair.w { font-family: var(--display); font-size: 17px; }
.pair:hover:not(:disabled) { border-color: var(--ink); }
.pair.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pair.done { border-color: var(--right); background: var(--right-bg); color: var(--right); cursor: default; }
.pair.flash { border-color: var(--wrong); background: var(--wrong-bg); }

.feedback {
  margin-top: 26px;
  border-top: 1px solid var(--ink);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: rise .25s ease;
}
.verdict { font-weight: 600; }
.verdict.right { color: var(--right); }
.verdict.wrong { color: var(--wrong); }
.feedback .hw { font-family: var(--display); font-size: 21px; }
.feedback .actions { margin-top: 8px; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.score { font-family: var(--display); font-size: clamp(44px, 11vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
.changes { list-style: none; margin: 0; padding: 0; }
.changes li {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.changes .head { font-family: var(--display); font-size: 19px; }
.changes .move { font-size: 14px; color: var(--muted); text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.changes .up { color: var(--right); }
.changes .down { color: var(--wrong); }

@media (prefers-reduced-motion: reduce) {
  .feedback { animation: none; }
  .bar i { transition: none; }
}
</style>

  {

    "hook": "Shares a root with \"practice\": pragmatic people care about what actually works.",
    "examples": {

const POS = { adjective: "adj.", verb: "v.", noun: "n.", phrase: "phr.", conjunction: "conj." };

const CONTEXT_LABEL = { interview: "In an interview", finance: "In finance", everyday: "In conversation" };

  meaning: "Name the word", define: "Pick the meaning", blank: "Fill the blank", upgrade: "Upgrade the phrase",

function blankProgress() { return { words: {}, days: [], history: [], updatedAt: 0 }; }
function wp(word) {

// ---------- dates ----------
function dayKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function startDate() {

  return new Date(y, m - 1, d);
}
function unlocked() {

  let n = 0;
  for (const d = startDate(); d <= today; d.setDate(d.getDate() + 1)) if (d.getDay() !== 6) n++;
  return WORDS.slice(0, Math.min(WORDS.length, n));
}
function streak() {
  const days = new Set(progress.days);
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function missedRecently() {
  const cutoff = Date.now() - 7 * DAY;
  return unlocked().filter(w => { const p = wp(w.word); return p.lastWrong >= cutoff && p.box < 3; });
}

// ---------- text helpers ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
// The inflected form used in a sentence: "mitigate" finds "mitigated", "headwind" finds "headwinds".
function formIn(w, sentence) {
  const stem = w.word.replace(/e$/, "");
  const m = sentence.match(new RegExp("\\b" + reEsc(stem) + "[a-z-]*", "i"));
  return m ? m[0] : w.word;
}
function splitAt(sentence, part) {
  const i = sentence.indexOf(part);
  return i < 0 ? [sentence, ""] : [sentence.slice(0, i), sentence.slice(i + part.length)];
}
function marked(sentence, form) {
  const [a, b] = splitAt(sentence, form);
  return esc(a) + "<b>" + esc(form) + "</b>" + esc(b);
}
function blanked(sentence, form, filled) {
  const [a, b] = splitAt(sentence, form);
  const mid = filled ? '<span class="blank filled">' + esc(form) + "</span>" : '<span class="blank" aria-label="blank">&nbsp;</span>';
  return esc(a) + mid + esc(b);
}
function underlined(sentence, phrase) {
  const [a, b] = splitAt(sentence, phrase);
  return esc(a) + '<span class="weak">' + esc(phrase) + "</span>" + esc(b);
}
function norm(s) {
  return s.toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z' -]/g, "").replace(/\s+/g, " ").trim().replace(/^the /, "");
}
function lev(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function meter(box) {
  let h = '<span class="meter" aria-hidden="true">';
  for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= box ? "on" : "") + '"></i>';
  return h + "</span>";
}
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function isSingle(w) { return !/\s/.test(w.word) && w.word.length <= 12; }

// ---------- storage ----------
function readLocal() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function writeLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
}
async function save() {
  progress.updatedAt = Date.now();
  writeLocal();
  if (!store.ref) return;
  if (store.saving) { store.pending = true; return; }
  store.saving = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(progress))); }
  catch (e) { if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) { store.ref = null; store.mode = "local"; } }
  store.saving = false;
  if (store.pending) { store.pending = false; save(); }
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  window.claude.use("sample").then(fn => { sampler = fn || null; }).catch(() => {});
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    store.ref = ref;
    store.mode = "account";
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updatedAt || 0) >= (progress.updatedAt || 0)) {
        progress = JSON.parse(JSON.stringify(remote));
        writeLocal();
      } else {
        save();
      }
    } else if (progress.updatedAt) {
      save();
    }
  } catch (e) {}
  if (view === "home") render();
  else renderStatus();
}

// ---------- building questions ----------
function distractors(w) {
  const same = shuffle(WORDS.filter(x => x !== w && x.part_of_speech === w.part_of_speech));
  const rest = shuffle(WORDS.filter(x => x !== w && x.part_of_speech !== w.part_of_speech));
  return same.concat(rest).slice(0, 3);
}
function typesFor(w, box, retry, used) {
  const single = isSingle(w);
  if (retry) return single ? ["build", "meaning", "blank"] : ["meaning", "blank"];
  if (box <= 0) return ["define", "meaning"].concat(single ? ["build"] : []);
  if (box === 1) return ["blank", "upgrade"].concat(single ? ["build"] : []);
  if (box === 2) return ["rewrite", "type"].concat(single ? ["build"] : []);
  return ["type", "rewrite"].concat(sampler && !used.use ? ["use"] : []);
}
// Picks the least-used allowed type so a session mixes formats.
function makeQuestion(w, box, retry, used) {
  const allowed = typesFor(w, box, retry, used);
  const least = Math.min(...allowed.map(t => used[t] || 0));
  const type = pick(allowed.filter(t => (used[t] || 0) === least));
  used[type] = (used[type] || 0) + 1;
  const ctx = pick(["interview", "finance", "everyday"]);
  const sentence = w.examples[ctx];
  const q = { w, type, ctx, sentence, form: formIn(w, sentence), retry };
  if (type === "rewrite") q.form = w.word;
  if (type === "build") {
    let tiles;
    do { tiles = shuffle(w.word.split("")); } while (tiles.join("") === w.word && w.word.length > 2);
    q.tiles = tiles;
    q.picked = [];
  }
  if (["meaning", "define", "blank", "upgrade"].includes(type)) {
    const opts = shuffle([w].concat(distractors(w)));
    q.options = opts.map(o => ({ label: type === "define" ? capital(o.definition) : o.word, correct: o === w }));
  }
  return q;
}
function makeMatch(words) {
  return {
    type: "match", words, retry: false,
    defs: shuffle(words.map((w, i) => i)),
    sel: null, done: new Set(), mistakes: new Set(), flash: null
  };
}
function buildSession(mode) {
  const now = Date.now();
  const pool = mode === "missed" ? missedRecently() : unlocked();
  const sorted = pool.slice().sort((a, b) => {
    const pa = wp(a.word), pb = wp(b.word);
    const da = pa.due <= now, dbb = pb.due <= now;
    if (da !== dbb) return da ? -1 : 1;
    if (pa.lapses !== pb.lapses) return pb.lapses - pa.lapses;
    if (pa.box !== pb.box) return pa.box - pb.box;
    return pa.due - pb.due;
  });
  const withMatch = pool.length >= 4;
  const chosen = shuffle(sorted.slice(0, Math.min(withMatch ? SESSION_SIZE - 1 : SESSION_SIZE, pool.length)));
  const used = {};
  const queue = chosen.map(w => makeQuestion(w, wp(w.word).box, false, used));
  if (withMatch) {
    const weakest = chosen.slice().sort((a, b) => wp(a.word).box - wp(b.word).box).slice(0, 4);
    queue.splice(Math.min(4, queue.length), 0, makeMatch(shuffle(weakest)));
  }
  return {
    queue, used, i: 0, answered: null, hint: false, startedAt: now,
    firstRight: 0, firstTotal: 0, results: {}, retries: {}
  };
}

// ---------- scoring ----------
function applyResult(w, correct, withHint) {
  const p = wp(w.word);
  const before = p.box;
  p.seen++;
  if (correct) {
    p.right++;
    if (!withHint) p.box = Math.min(5, p.box + 1);
    const days = Math.max(1, Math.round(INTERVAL_DAYS[p.box] * (p.lapses >= 2 ? 0.5 : 1)));
    p.due = startOfToday() + days * DAY;
  } else {
    p.wrong++;
    p.lapses++;
    p.lastWrong = Date.now();
    p.box = 0;
    p.due = Date.now();
  }
  progress.words[w.word] = p;
  const r = S.results[w.word];
  S.results[w.word] = { before: r ? r.before : before, after: p.box, missed: (r && r.missed) || !correct };
}
// A miss brings the word back twice more in this session (2 and 5 questions later).
function scheduleRetries(w) {
  const n = S.retries[w.word] || 0;
  if (n >= 3) return;
  const offsets = n === 0 ? [2, 5] : [3];
  offsets.forEach((off, k) => {
    const pos = Math.min(S.i + off + k, S.queue.length);
    S.queue.splice(pos, 0, makeQuestion(w, 0, true, S.used));
  });
  S.retries[w.word] = n + offsets.length;
}
function answer(correct, extra) {
  const q = S.queue[S.i];
  S.answered = Object.assign({ correct }, extra || {});
  if (!q.retry) {
    S.firstTotal++;
    if (correct) S.firstRight++;
    applyResult(q.w, correct, S.hint);
  } else if (S.results[q.w.word] && !correct) {
    S.results[q.w.word].missed = true;
  }
  if (!correct) scheduleRetries(q.w);
  save();
  render();
}

// ---------- handlers per type ----------
function choose(i) {
  if (!S || S.answered) return;
  const q = S.queue[S.i];
  if (!q.options || !q.options[i]) return;
  answer(q.options[i].correct, { chosen: i });
}
function checkWord(raw, q) {
  const a = norm(raw);
  const targets = [norm(q.form), norm(q.w.word)];
  const stem = norm(q.w.word.replace(/e$/, ""));
  if (targets.includes(a) || (a.startsWith(stem) && a.length <= stem.length + 4)) return { ok: true };
  if (q.w.word.length >= 6 && Math.min(...targets.map(t => lev(a, t))) <= 1) return { ok: true, typo: true };
  return { ok: false };
}
function submitTyped() {
  if (!S || S.answered) return;
  const q = S.queue[S.i];
  const input = document.getElementById("answer");
  const raw = input ? input.value : "";
  if (!norm(raw)) { if (input) input.focus(); return; }
  const r = checkWord(raw, q);
  answer(r.ok, { typed: raw, typo: r.typo });
}
function tapTile(i) {
  const q = S.queue[S.i];
  if (S.answered || q.picked.includes(i)) return;
  q.picked.push(i);
  if (q.picked.length === q.tiles.length) {
    const built = q.picked.map(k => q.tiles[k]).join("");
    answer(built === q.w.word, { built });
  } else render();
}
function untile() { const q = S.queue[S.i]; if (!S.answered && q.picked.length) { q.picked.pop(); render(); } }
function clearTiles() { const q = S.queue[S.i]; if (!S.answered) { q.picked = []; render(); } }
function typeTile(ch) {
  const q = S.queue[S.i];
  const i = q.tiles.findIndex((c, k) => c === ch && !q.picked.includes(k));
  if (i >= 0) tapTile(i);
}

function matchWord(i) {
  const q = S.queue[S.i];
  if (S.answered || q.done.has(i)) return;
  q.sel = q.sel === i ? null : i;
  render();
}
function matchDef(d) {
  const q = S.queue[S.i];
  if (S.answered || q.sel === null || q.done.has(d)) return;
  if (q.sel === d) {
    q.done.add(d);
    q.sel = null;
    if (q.done.size === q.words.length) finishMatch(q);
    else render();
  } else {
    q.mistakes.add(q.sel);
    q.flash = { w: q.sel, d };
    const sel = q.sel;
    q.sel = null;
    render();
    setTimeout(() => { if (q.flash && q.flash.w === sel) { q.flash = null; if (S && S.queue[S.i] === q) render(); } }, 650);
  }
}
function finishMatch(q) {
  const clean = q.mistakes.size === 0;
  S.answered = { correct: clean };
  S.firstTotal++;
  if (clean) S.firstRight++;
  q.words.forEach((w, i) => {
    if (q.mistakes.has(i)) { applyResult(w, false, false); scheduleRetries(w); }
    else { const p = wp(w.word); p.seen++; p.right++; progress.words[w.word] = p; }
  });
  save();
  render();
}

async function submitUse() {
  const q = S.queue[S.i];
  if (S.answered || q.pending) return;
  const box = document.getElementById("sentence");
  const text = box ? box.value.trim() : "";
  if (text.length < 8) { if (box) box.focus(); return; }
  q.draft = text;
  if (!sampler) { q.error = "Claude can’t check sentences in this view, so this one is skipped."; render(); return; }
  q.pending = true;
  q.error = null;
  render();
  const prompt =
    "You coach a college finance student on speaking well in interviews. They are practicing the word \"" + q.w.word +
    "\" (" + q.w.part_of_speech + ": " + q.w.definition + ").\n\nTheir sentence:\n\"\"\"" + text + "\"\"\"\n\n" +
    "Judge whether the word is used correctly and sounds natural, the way a sharp professional would say it out loud. " +
    "Reply with only JSON: {\"verdict\": \"great\" | \"good\" | \"off\", \"feedback\": \"one short, specific sentence\", " +
    "\"better\": \"their sentence improved, keeping their meaning and the word\"}. " +
    "Use \"off\" if the word is missing, misused, or the meaning is wrong. Keep feedback plain and direct.";
  try {
    const r = await sampler.json(prompt, { modelTier: "quick" });
    q.pending = false;
    const verdict = r && ["great", "good", "off"].includes(r.verdict) ? r.verdict : "off";
    answer(verdict !== "off", { use: { verdict, feedback: String((r && r.feedback) || ""), better: String((r && r.better) || "") } });
  } catch (e) {
    q.pending = false;
    const code = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      sampler = null;
      q.error = "Claude can’t check sentences in this view, so this one is skipped.";
    } else if (code === "rate_limited") {
      q.error = "Claude is busy right now. Try again in a minute, or skip this one.";
    } else {
      q.error = "That check didn’t go through. Try again, or skip this one.";
    }
    render();
  }
}
function skip() {
  if (!S) return;
  S.i++;
  S.answered = null;
  S.hint = false;
  if (S.i >= S.queue.length) finish(); else render();
}
function next() {
  if (!S || !S.answered) return;
  skip();
}
function finish() {
  const today = dayKey(new Date());
  if (!progress.days.includes(today)) progress.days.push(today);
  progress.days = progress.days.slice(-400);
  progress.history.push({ date: today, right: S.firstRight, total: S.firstTotal, secs: Math.round((Date.now() - S.startedAt) / 1000) });
  progress.history = progress.history.slice(-60);
  save();
  view = "done";
  render();
  window.scrollTo(0, 0);
}

// ---------- rendering ----------
function renderStatus() {
  const s = streak();
  statusEl.textContent = s ? s + (s === 1 ? " day" : " days") + " in a row" : "";
}
function render() {
  renderStatus();
  if (view === "quiz") renderQuiz();
  else if (view === "done") renderDone();
  else renderHome();
}

function renderHome() {
  const words = unlocked();
  const now = Date.now();
  const due = words.filter(w => wp(w.word).due <= now).length;
  const missed = missedRecently();
  const s = streak();
  const size = Math.min(SESSION_SIZE, words.length);
  if (!words.length) {
    const first = startDate().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    app.innerHTML = '<div class="stack"><p class="eyebrow">Practice</p>' +
      "<h1>Your first word arrives " + esc(first) + ".</h1>" +
      '<p class="lede">Each morning’s email adds one word here. Saturdays are the weekly quiz, so no new word that day. Come back after your first email to practice it.</p></div>';
    return;
  }
  let h = '<div class="stack">';
  h += '<p class="eyebrow">Practice</p>';
  h += "<h1>" + size + " rounds on the words you’ve had so far.</h1>";
  h += '<p class="lede">About four minutes. Anything you miss comes back twice more in the same round, then again tomorrow.</p>';
  h += '<div class="actions"><button class="btn primary" id="start" data-act="start"' + (words.length ? "" : " disabled") + ">Start practice</button>";
  if (missed.length) h += '<button class="btn secondary" data-act="missed">Drill ' + missed.length + " missed " + (missed.length === 1 ? "word" : "words") + "</button>";
  h += "</div></div>";

  h += '<div class="section"><div class="stats">';
  h += stat(words.length, "Words learned");
  h += stat(due, "Due for review");
  h += stat(missed.length, "Missed this week");
  h += stat(s, s === 1 ? "Day in a row" : "Days in a row");
  h += "</div></div>";

  h += '<div class="section"><h2>Word bank</h2><ul class="bank">';
  words.slice().reverse().forEach(w => {
    const idx = WORDS.indexOf(w) + 1;
    const p = wp(w.word);
    const isOpen = open.has(w.word);
    const wasMissed = missed.includes(w);
    h += "<li>";
    h += '<button class="entry" data-act="toggle" data-w="' + esc(w.word) + '" aria-expanded="' + isOpen + '">';
    h += '<span><span class="head">' + esc(w.word) + '</span><span class="pos">' + esc(POS[w.part_of_speech] || "") + " · level " + w.level + "</span></span>";
    h += '<span class="lvl">' + meter(p.box) + '<span class="' + (wasMissed ? "missed" : "") + '">' + (wasMissed ? "Missed" : LEVELS[p.box]) + "</span></span>";
    h += '<span class="def">' + esc(capital(w.definition)) + "</span>";
    h += "</button>";
    if (isOpen) {
      h += '<div class="detail">';
      h += '<p class="sub" style="margin:0">' + (w.pronunciation ? "<i>" + esc(w.pronunciation) + "</i> &nbsp;·&nbsp; " : "") + "Word No. " + idx + "</p>";
      ["interview", "finance", "everyday"].forEach(c => {
        const sen = w.examples[c];
        h += '<div class="ctx"><p class="eyebrow">' + CONTEXT_LABEL[c] + "</p><p>“" + marked(sen, formIn(w, sen)) + "”</p></div>";
      });
      h += "<p><i>Origin.</i> " + esc(w.hook) + "</p>";
      h += "<p><i>Instead of</i> “" + esc(w.instead_of) + ",” say <b>" + esc(w.word) + "</b>.</p>";
      h += '<p class="tally">' + (p.seen ? "Answered " + p.seen + (p.seen === 1 ? " time" : " times") + ", " + p.right + " right" : "Not practiced yet") + "</p>";
      h += "</div>";
    }
    h += "</li>";
  });
  h += "</ul>";
  h += '<p class="note">' + (store.mode === "account" ? "Progress saves to your Claude account." : "Progress is saved on this device.") + "</p>";
  h += "</div>";
  app.innerHTML = h;
}
function stat(n, label) {
  return '<div class="stat"><span class="n">' + n + '</span><span class="l">' + label + "</span></div>";
}

function renderQuiz() {
  const q = S.queue[S.i];
  const A = S.answered;
  const total = S.queue.length;
  let h = '<div class="qhead"><span>' + (S.i + 1) + " of " + total + "</span><span>" + KIND[q.type] + (q.retry ? ", another look" : "") + "</span></div>";
  h += '<div class="bar"><i style="width:' + Math.round((S.i / total) * 100) + '%"></i></div>';

  if (q.type === "match") { app.innerHTML = h + matchBody(q, A); return; }

  if (q.type === "meaning") {
    h += '<p class="prompt">' + esc(capital(q.w.definition)) + ".</p>";
  } else if (q.type === "define") {
    h += '<p class="prompt headword">' + esc(q.w.word) + "</p>";
    h += '<p class="sub"><i>' + esc(POS[q.w.part_of_speech] || "") + "</i>" + (q.w.pronunciation ? " &nbsp;·&nbsp; <i>" + esc(q.w.pronunciation) + "</i>" : "") + "</p>";
  } else if (q.type === "blank") {
    h += '<p class="prompt">“' + blanked(q.sentence, q.form, !!A) + "”</p>";
  } else if (q.type === "upgrade") {
    h += '<p class="prompt">Instead of saying “' + esc(q.w.instead_of) + ",” which sounds sharper?</p>";
  } else if (q.type === "type") {
    h += '<p class="prompt">“' + blanked(q.sentence, q.form, !!A) + "”</p>";
    h += '<p class="sub">' + esc(capital(q.w.definition)) + ".</p>";
  } else if (q.type === "rewrite") {
    h += '<p class="prompt">“' + underlined(q.w.weak.sentence, q.w.weak.phrase) + "”</p>";
    h += '<p class="sub">Swap the underlined words for one sharper word or phrase.</p>';
  } else if (q.type === "build") {
    h += '<p class="prompt">' + esc(capital(q.w.definition)) + ".</p>";
    h += '<p class="sub">Tap the letters in order, or type them.</p>';
  } else if (q.type === "use") {
    h += '<p class="prompt">Use <b>' + esc(q.w.word) + "</b> in a sentence about your own experience.</p>";
    h += '<p class="sub">An internship, a class project, a club, a team. Claude will check whether it sounds natural.</p>';
  }

  if (q.options) {
    h += '<div class="options">';
    q.options.forEach((o, i) => {
      let cls = "option" + (q.type === "define" ? "" : " word");
      if (A) cls += o.correct ? " right" : A.chosen === i ? " wrong" : " dim";
      h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '"' + (A ? " disabled" : "") + '><span class="k">' + (i + 1) + "</span><span>" + esc(o.label) + "</span></button>";
    });
    h += "</div>";
  } else if (q.type === "type" || q.type === "rewrite") {
    const cls = A ? (A.correct ? "right" : "wrong") : "";
    h += '<form class="typed" id="typed" autocomplete="off">';
    h += '<label class="eyebrow" for="answer">Your answer</label>';
    h += '<div class="line"><input id="answer" class="' + cls + '" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" value="' + esc(A ? A.typed : "") + '"' + (A ? " readonly" : "") + ">";
    if (!A) h += '<button class="btn primary" type="submit">Check</button>';
    h += "</div>";
    if (!A) {
      if (S.hint) h += '<p class="hint">Starts with “' + esc(q.w.word.charAt(0)) + "”, " + q.w.word.replace(/[^a-zA-Z]/g, "").length + " letters</p>";
      else h += '<div><button class="btn quiet" type="button" data-act="hint">Show a hint</button></div>';
    }
    h += "</form>";
  } else if (q.type === "build") {
    const built = q.picked.map(k => q.tiles[k]);
    h += '<div class="slots' + (A ? (A.correct ? " right" : " wrong") : "") + '">';
    for (let i = 0; i < q.tiles.length; i++) h += '<span class="slot">' + esc(built[i] || "") + "</span>";
    h += "</div>";
    if (!A) {
      h += '<div class="tiles">';
      q.tiles.forEach((c, i) => { h += '<button class="tile" data-act="tile" data-i="' + i + '"' + (q.picked.includes(i) ? " disabled" : "") + ">" + esc(c) + "</button>"; });
      h += '</div><div class="actions" style="margin-top:10px"><button class="btn quiet" data-act="untile">Undo</button><button class="btn quiet" data-act="cleartiles">Clear</button></div>';
    }
  } else if (q.type === "use") {
    h += '<form class="typed" id="useform" autocomplete="off">';
    h += '<label class="eyebrow" for="sentence">Your sentence</label>';
    h += '<textarea id="sentence" rows="3"' + (A || q.pending ? " readonly" : "") + ">" + esc(q.draft || "") + "</textarea>";
    if (!A) {
      h += '<div class="actions"><button class="btn primary" type="submit"' + (q.pending ? " disabled" : "") + ">" + (q.pending ? "Checking…" : "Check my sentence") + "</button>";
      h += '<button class="btn quiet" type="button" data-act="skip">Skip</button></div>';
      if (q.error) h += '<p class="hint">' + esc(q.error) + "</p>";
    }
    h += "</form>";
  }

  if (A) h += feedbackBody(q, A);
  app.innerHTML = h;
  if (A) { const b = document.getElementById("next"); if (b) b.focus({ preventScroll: true }); }
  else if (q.type === "type" || q.type === "rewrite") { const i = document.getElementById("answer"); if (i) i.focus({ preventScroll: true }); }
}

function feedbackBody(q, A) {
  const other = ["interview", "finance", "everyday"].filter(c => c !== q.ctx);
  const showCtx = (q.type === "blank" || q.type === "type") ? pick(other) : q.ctx;
  const sen = q.w.examples[showCtx];
  let h = '<div class="feedback">';
  let verdict = A.correct ? "Correct." : "Not quite.";
  if (q.type === "use") verdict = A.use.verdict === "great" ? "Natural and correct." : A.use.verdict === "good" ? "Correct." : "Not quite.";
  else if (A.correct && A.typo) verdict = "Correct. Watch the spelling: " + q.form + ".";
  else if (A.correct && S.hint) verdict = "Correct, with a hint. It will come back sooner.";
  else if (!A.correct && q.type === "build") verdict = "Not quite. It’s spelled " + q.w.word + ".";
  else if (!A.correct && (q.type === "type" || q.type === "rewrite")) verdict = "Not quite. The word is " + q.w.word + ".";
  h += '<p class="verdict ' + (A.correct ? "right" : "wrong") + '">' + esc(verdict) + "</p>";
  if (q.type === "use") {
    if (A.use.feedback) h += "<p>" + esc(A.use.feedback) + "</p>";
    if (A.use.better) h += '<p class="eyebrow">Stronger version</p><p>“' + esc(A.use.better) + "”</p>";
  } else {
    h += '<p><span class="hw">' + esc(q.w.word) + '</span> <i class="sub">' + esc(POS[q.w.part_of_speech] || "") + "</i></p>";
    h += "<p>" + esc(capital(q.w.definition)) + ".</p>";
    if (q.type === "rewrite") {
      h += '<p class="eyebrow">Stronger</p><p>“' + marked(q.w.examples.interview, formIn(q.w, q.w.examples.interview)) + "”</p>";
    } else {
      h += '<p class="eyebrow">' + CONTEXT_LABEL[showCtx] + "</p><p>“" + marked(sen, formIn(q.w, sen)) + "”</p>";
    }
    if (!A.correct) h += '<p class="sub"><i>Origin.</i> ' + esc(q.w.hook) + "</p>";
  }
  if (!A.correct) h += '<p class="sub">You’ll see this one again in a couple of questions.</p>';
  h += '<div class="actions"><button class="btn primary" id="next" data-act="next">' + (S.i + 1 >= S.queue.length ? "See results" : "Continue") + "</button></div>";
  return h + "</div>";
}

function matchBody(q, A) {
  let h = '<p class="prompt">Match each word to its meaning.</p>';
  h += '<p class="sub">Tap a word, then its meaning.</p>';
  h += '<div class="match"><div class="col">';
  q.words.forEach((w, i) => {
    let cls = "pair w";
    if (q.done.has(i)) cls += " done";
    else if (q.sel === i) cls += " sel";
    else if (q.flash && q.flash.w === i) cls += " flash";
    h += '<button class="' + cls + '" data-act="mw" data-i="' + i + '"' + (q.done.has(i) || A ? " disabled" : "") + ' aria-pressed="' + (q.sel === i) + '">' + esc(w.word) + "</button>";
  });
  h += '</div><div class="col">';
  q.defs.forEach(d => {
    let cls = "pair";
    if (q.done.has(d)) cls += " done";
    else if (q.flash && q.flash.d === d) cls += " flash";
    h += '<button class="' + cls + '" data-act="md" data-i="' + d + '"' + (q.done.has(d) || A ? " disabled" : "") + ">" + esc(capital(q.words[d].definition)) + "</button>";
  });
  h += "</div></div>";
  if (A) {
    const missedWords = [...q.mistakes].map(i => q.words[i].word);
    h += '<div class="feedback">';
    h += '<p class="verdict ' + (A.correct ? "right" : "wrong") + '">' + (A.correct ? "All four on the first try." : "Mixed up: " + esc(missedWords.join(", ")) + ".") + "</p>";
    if (!A.correct) h += '<p class="sub">Those come back in the next few questions.</p>';
    h += '<div class="actions"><button class="btn primary" id="next" data-act="next">' + (S.i + 1 >= S.queue.length ? "See results" : "Continue") + "</button></div></div>";
  }
  return h;
}

function renderDone() {
  const secs = progress.history.length ? progress.history[progress.history.length - 1].secs : 0;
  const m = Math.floor(secs / 60), s = secs % 60;
  const missed = Object.keys(S.results).filter(k => S.results[k].missed);
  let h = '<div class="stack">';
  h += '<p class="eyebrow">Practice complete</p>';
  h += '<p class="score">' + S.firstRight + " of " + S.firstTotal + "</p>";
  h += '<p class="lede">Right on the first try, in ' + (m ? m + " min " : "") + s + " s." + (missed.length ? " Missed words are due again in your next round." : "") + "</p>";
  h += '<div class="actions"><button class="btn primary" data-act="home">Back to word bank</button><button class="btn secondary" data-act="start">Practice again</button></div>';
  h += "</div>";
  h += '<div class="section"><h2>Where each word stands</h2><ul class="changes">';
  Object.keys(S.results).sort((a, b) => (S.results[b].missed ? 1 : 0) - (S.results[a].missed ? 1 : 0)).forEach(word => {
    const r = S.results[word];
    let move = "<span>" + LEVELS[r.after] + "</span>";
    if (r.missed) move = '<span class="down">Missed, back to ' + LEVELS[r.after] + "</span>";
    else if (r.after > r.before) move = '<span class="up">' + LEVELS[r.before] + " to " + LEVELS[r.after] + "</span>";
    h += '<li><span class="head">' + esc(word) + '</span><span class="move">' + meter(r.after) + move + "</span></li>";
  });
  h += "</ul></div>";
  app.innerHTML = h;
}

// ---------- events ----------
function begin(mode) {
  S = buildSession(mode);
  if (!S.queue.length) return;
  view = "quiz";
  render();
  window.scrollTo(0, 0);
}
app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const i = Number(t.dataset.i);
  if (act === "start") begin("all");
  else if (act === "missed") begin("missed");
  else if (act === "opt") choose(i);
  else if (act === "next") next();
  else if (act === "skip") skip();
  else if (act === "hint") { S.hint = true; render(); }
  else if (act === "tile") tapTile(i);
  else if (act === "untile") untile();
  else if (act === "cleartiles") clearTiles();
  else if (act === "mw") matchWord(i);
  else if (act === "md") matchDef(i);
  else if (act === "home") { view = "home"; S = null; render(); window.scrollTo(0, 0); }
  else if (act === "toggle") {
    const w = t.dataset.w;
    if (open.has(w)) open.delete(w); else open.add(w);
    renderHome();
    const el = app.querySelector('[data-w="' + CSS.escape(w) + '"]');
    if (el) el.focus({ preventScroll: true });
  }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "useform") submitUse(); else submitTyped();
});
document.addEventListener("keydown", e => {
  if (view !== "quiz" || !S) return;
  const q = S.queue[S.i];
  const inField = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (S.answered) {
    if (e.key === "Enter" && document.activeElement && document.activeElement.id !== "next") { e.preventDefault(); next(); }
    return;
  }
  if (q.options && /^[1-4]$/.test(e.key)) { e.preventDefault(); choose(Number(e.key) - 1); }
  else if (q.type === "build" && !inField) {
    if (e.key === "Backspace") { e.preventDefault(); untile(); }
    else if (/^[a-z]$/i.test(e.key)) { e.preventDefault(); typeTile(e.key.toLowerCase()); }
  }
});

// ---------- boot ----------
function start(data) {
  if (data && data.progress) progress = data.progress;
  else { const local = readLocal(); if (local) progress = local; }
  render();
  connect();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ progress }));
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
